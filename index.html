<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxury Route Collection</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <h1>WCC Graveliers</h1>
    <p>Curated Premium Gravel Experiences</p>
  </header>

  <section class="toolbar" aria-label="Ride planner controls">
    <div class="toolbar-group">
      <label for="speed-input">Your average speed</label>
      <div class="speed-field">
        <input id="speed-input" type="number" min="5" max="60" step="0.5" inputmode="decimal">
        <span>km/h</span>
      </div>
    </div>

    <div class="toolbar-group">
      <label for="sort-select">Sort routes</label>
      <select id="sort-select">
        <option value="default">Default order</option>
        <option value="shortest">Shortest first</option>
        <option value="longest">Longest first</option>
        <option value="least-climbing">Least climbing</option>
        <option value="most-climbing">Most climbing</option>
      </select>
    </div>

    <p class="toolbar-note">
      Estimated times use your speed on the flat and slow down for the climbing. Stops are not included.
    </p>
  </section>

  <section id="routes"></section>

  <script src="script.js"></script>
</body>
</html>
